[project]
name = "qa-tests"
version = "0.1.0"
description = "QA Track test suite for PruebasHermes / gestor-inventario"
requires-python = ">=3.10"

dependencies = [
  "pytest>=8.0",
  "httpx>=0.27",
  "pytest-asyncio>=0.23",
  "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"

[tool.pytest-asyncio]
anyio_backends = ["asyncio", "trio"]
