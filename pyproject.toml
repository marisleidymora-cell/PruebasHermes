[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pruebas-qa-track"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pytest>=9.1",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "python-dotenv>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.pytest-asyncio]
asyncio_default_fixture_loop_scope = "function"
